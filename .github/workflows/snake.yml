name: Update README snake

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BRANCH: bot/readme-snake
  SNAKE_PATHS: "profile/snake.svg profile/snake-dark.svg"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip if a snake PR is already open
        id: gate
        run: |
          open_prs=$(gh pr list --state open --head "$BRANCH" --json number --jq length)
          if [ "$open_prs" != "0" ]; then
            echo "Open snake PR exists, skipping run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate snake SVGs
        if: steps.gate.outputs.skip != 'true'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit via GitHub API, open PR and merge
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "Snake unchanged, nothing to do"
            exit 0
          fi

          repo="${{ github.repository }}"
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)

          gh api "repos/$repo/git/refs/heads/$BRANCH" -X DELETE >/dev/null 2>&1 || true
          gh api "repos/$repo/git/refs" -X POST -f ref="refs/heads/$BRANCH" -f sha="$main_sha" >/dev/null

          # Same verified-commit pattern as grs.yml: REST API commits made with
          # GITHUB_TOKEN are signed by GitHub and satisfy required_signatures.
          for f in $SNAKE_PATHS; do
            args=(-f message="docs: update README snake" -f branch="$BRANCH" -f content="$(base64 -w0 "$f")")
            file_sha=$(gh api "repos/$repo/contents/$f?ref=main" --jq .sha 2>/dev/null || true)
            [ -n "$file_sha" ] && args+=(-f sha="$file_sha")
            gh api "repos/$repo/contents/$f" -X PUT "${args[@]}" --jq .commit.sha
          done

          gh pr create --title "docs: update README snake" --head "$BRANCH" \
            --body $'Automated weekly refresh of the contribution snake, generated by Platane/snk. Merged automatically by the workflow once branch protection conditions pass.\n\n---\n\n贡献贪吃蛇的每周自动更新,由 Platane/snk 生成。分支保护条件满足后由 workflow 自动合并。'

          for i in 1 2 3 4 5 6; do
            sleep 10
            if gh pr merge --squash --delete-branch "$BRANCH"; then
              echo "Merged"
              exit 0
            fi
          done
          echo "Merge did not complete; leaving PR open for manual review"
          exit 1
