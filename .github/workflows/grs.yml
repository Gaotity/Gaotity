name: Update README cards

on:
  schedule:
    - cron: "7 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BRANCH: bot/readme-cards
  CARD_PATHS: "profile/stats.svg profile/top-langs.svg"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip if a cards PR is already open
        id: gate
        run: |
          open_prs=$(gh pr list --state open --head "$BRANCH" --json number --jq length)
          if [ "$open_prs" != "0" ]; then
            echo "Open cards PR exists, skipping run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stats card
        if: steps.gate.outputs.skip != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        if: steps.gate.outputs.skip != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards via GitHub API, open PR and merge
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "Cards unchanged, nothing to do"
            exit 0
          fi

          repo="${{ github.repository }}"
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)

          gh api "repos/$repo/git/refs/heads/$BRANCH" -X DELETE >/dev/null 2>&1 || true
          gh api "repos/$repo/git/refs" -X POST -f ref="refs/heads/$BRANCH" -f sha="$main_sha" >/dev/null

          # Commits created through the REST API with a bot token (GITHUB_TOKEN)
          # are signed by GitHub itself, so they are verified and satisfy the
          # required_signatures branch rule. Plain git pushes would be unsigned
          # and the merge would be blocked.
          for f in $CARD_PATHS; do
            args=(-f message="docs: update README cards" -f branch="$BRANCH" -f content="$(base64 -w0 "$f")")
            file_sha=$(gh api "repos/$repo/contents/$f?ref=main" --jq .sha 2>/dev/null || true)
            [ -n "$file_sha" ] && args+=(-f sha="$file_sha")
            gh api "repos/$repo/contents/$f" -X PUT "${args[@]}" --jq .commit.sha
          done

          gh pr create --title "docs: update README cards" --head "$BRANCH" \
            --body $'Automated weekly refresh of the README cards, generated by stats-organization/github-readme-stats-action. Merged automatically by the workflow once branch protection conditions pass.\n\n---\n\nREADME 卡片的每周自动更新,由 stats-organization/github-readme-stats-action 生成。分支保护条件满足后由 workflow 自动合并。'

          # Direct merge with retries: gh pr merge --auto is accepted by this
          # repo but never fires because no required status checks exist.
          for i in 1 2 3 4 5 6; do
            sleep 10
            if gh pr merge --squash --delete-branch "$BRANCH"; then
              echo "Merged"
              exit 0
            fi
          done
          echo "Merge did not complete; leaving PR open for manual review"
          exit 1
